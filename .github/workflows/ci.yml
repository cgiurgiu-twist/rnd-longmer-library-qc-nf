name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stub:
    name: Wiring (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Nextflow
        # Pinned to the version this pipeline is validated on and that the Seqera
        # preRunScript sets. Newer parsers reject syntax this one accepts.
        env:
          NXF_VER: 25.10.4
        run: curl -s https://get.nextflow.io | bash && sudo mv nextflow /usr/local/bin/
      - name: Stub run
        env:
          NXF_VER: 25.10.4
        run: nextflow run . -profile stub -stub --outdir results_stub

  end_to_end:
    name: End-to-end on bundled fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install tools
        run: pip install 'mappy==2.28' edlib cutadapt numpy matplotlib openpyxl python-docx
      - name: Install Nextflow
        # Pinned to the version this pipeline is validated on and that the Seqera
        # preRunScript sets. Newer parsers reject syntax this one accepts.
        env:
          NXF_VER: 25.10.4
        run: curl -s https://get.nextflow.io | bash && sudo mv nextflow /usr/local/bin/
      - name: Run
        env:
          NXF_VER: 25.10.4
        run: nextflow run . -profile local
      - name: Check the numbers have not moved
        # These are the validated slice values (docs/VALIDATION.md). A change here is a real
        # behaviour change and must be explained in the PR, not re-baselined silently.
        run: |
          python3 - <<'PY'
          import json, sys
          core = json.load(open('results_test/metrics/metrics_core.json'))
          scope = json.load(open('results_test/metrics/blockdel_scope.json'))
          expect_clean = {'AILK014-007': 99.86, 'AILK014-008': 100.0, 'AILK014-009': 99.72}
          expect_del   = {'AILK014-007': 6.79,  'AILK014-008': 7.48,  'AILK014-009': 5.34}
          bad = []
          for o, v in expect_clean.items():
              got = core['per_sublib'][o]['clean_designed_pct_of_assigned']
              if abs(got - v) > 0.05: bad.append(f'clean {o}: expected {v}, got {got}')
          for o, v in expect_del.items():
              got = scope['per_sublib_any_cls'][o]['pct']
              if abs(got - v) > 0.05: bad.append(f'deletion {o}: expected {v}, got {got}')
          ctl = json.load(open('results_test/metrics/controls.json'))
          for k, c in ctl['classifier']['negative'].items():
              if c['pct'] > 0.5: bad.append(f'classifier false chimera {k}: {c["pct"]}%')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('metrics and controls match the validated baseline')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results_test
          path: results_test
